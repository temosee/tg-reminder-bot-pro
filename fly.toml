[build]

[env]
  DB_PATH = "/data/reminders.db"

[[mounts]]
  source = "reminders_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
